<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Data Insights Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .results-container {
            max-height: 500px;
            overflow-y: auto;
        }
        .visualization-container {
            max-width: 100%;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Web Data Insights Explorer</h1>
        <form method="POST" class="mb-4">
            <div class="mb-3">
                <label for="url" class="form-label">URL:</label>
                <input type="text" class="form-control" id="url" name="url" required>
            </div>
            
            <div class="mb-3">
                <label for="regex_option" class="form-label">Select Data to Extract:</label>
                <select class="form-select" id="regex_option" name="regex_option">
                    {% for option in regex_options %}
                    <option value="{{ option }}">{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="custom_regex" class="form-label">Custom Regex:</label>
                <input type="text" class="form-control" id="custom_regex" name="custom_regex">
            </div>
            
            <button type="submit" class="btn btn-primary">Scrape and Analyze</button>
        </form>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        {% if results %}
        <div class="results mt-4">
            <h2>Results:</h2>
            <div class="results-container">
                {{ results|safe }}
            </div>
            {% if csv_filename %}
            <a href="{{ url_for('download_file', filename=csv_filename) }}" class="btn btn-success mt-3">Download CSV</a>
            {% endif %}
        </div>
        {% endif %}

        {% if plot_filename %}
        <div class="visualization mt-4">
            <h2>Visualizations:</h2>
            <div class="visualization-container">
                <img src="{{ url_for('download_plot', filename=plot_filename) }}" alt="Data Visualizations" class="img-fluid">
            </div>
            <a href="{{ url_for('download_plot', filename=plot_filename) }}" class="btn btn-info mt-3">Download Visualizations</a>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
